@if ((countries$ | async); as countries) {
  <div class="row">
    <div class="col-md-12 options">
      @for (country of countries; track country; let index = $index) {
        <label class="checkbox-inline">
          <input type="checkbox" [(ngModel)]="country.selected" />{{ index + 1 }}
        </label>
      }
    </div>
  </div>
  <div class="row" rtSelectionArea>
    @for (country of countries; track country) {
      <div class="col-md-12 item" [rtSelectable]="country" [(selected)]="country.selected">
        {{ country.name }}
      </div>
    }
  </div>
}
