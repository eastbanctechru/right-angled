@if ((countries$ | async); as countries) {
  <div
    class="row"
    rtSelectionArea="countries"
    (itemSelected)="onItemSelected($event)"
    (itemDeselected)="onItemDeselected($event)"
    >
    @for (country of countries; track country) {
      <div class="col-md-12">
        <rt-demo-country-details
          #detailsComp
          [country]="country"
          [rtSelectable]="country"
          (itemSelected)="detailsComp.onSelected()"
          (itemDeselected)="detailsComp.onDeselected()"
          >
        </rt-demo-country-details>
      </div>
    }
  </div>
}
