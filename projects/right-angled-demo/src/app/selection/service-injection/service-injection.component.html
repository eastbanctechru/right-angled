<div class="row" rtSelectionArea>
  <div class="col-md-12 toolbar">
    <rt-demo-nested-button></rt-demo-nested-button>
  </div>
  @for (country of (countries$ | async); track country) {
    <div class="col-md-12">
      <div class="item" [rtSelectable]="country">
        {{ country.name }}
      </div>
    </div>
  }
</div>
