<div class="toolbar">
  <button type="button" class="btn btn-primary" title="Reload data" (click)="reload()">Reload data</button>
</div>
<div class="row text-center" rtSelectionArea [trackBy]="trackByName">
  @for (country of countries$ | async; track country) {
    <div class="col-md-12">
      <div class="item" [rtSelectable]="country">
        {{ country.name }}
      </div>
    </div>
  }
  @if (!(countries$ | async).length) {
    <rt-demo-progress-bar></rt-demo-progress-bar>
  }
</div>
