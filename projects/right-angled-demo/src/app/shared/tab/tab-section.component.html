<div class="row">
  <div class="tab-body col-lg-10 col-md-12 col-lg-offset-1">
    <ul class="tabs">
      @for (tab of tabs; track tab) {
        <li (click)="pick(tab)" [class.active]="tab.isActive$ | async" [title]="tab.tabTitle">
          <button class="btn btn-primary">{{ tab.tabTitle }}</button>
        </li>
      }
    </ul>
    <div class="tab-content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
